<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Comparison</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #5f5f5f;
    --bg: #ffffff;
    --gap: 32px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px 64px;
    background: var(--bg);
    color: var(--text-primary);
    font-family: Trebuchet MS, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .heading {
    font-size: clamp(1.75rem, 3vw, 2.5rem);
    font-weight: 700;
    text-align: center;
    max-width: 700px;
    margin: 0 0 12px;
    line-height: 1.2;
  }

  .description {
    font-size: 1rem;
    color: var(--text-secondary);
    text-align: center;
    max-width: 560px;
    margin: 0 0 40px;
    line-height: 1.5;
  }

  .image-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--gap);
    width: 100%;
    max-width: 900px;
  }

  .image-block {
    flex: 1 1 320px;
    max-width: 400px;
    text-align: center;
  }

  .image-block img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    background: #eee;
  }

  .image-blurb {
    margin: 12px 0 0;
    font-size: 0.875rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  @media (max-width: 600px) {
    .image-row { gap: 20px; }
  }
</style>
</head>
<body>

  <h1 class="heading">Part 1</h1>
  <p class="description">A shorter description of what these two images are about goes here, giving a bit more context underneath the main heading.</p>

  <div class="image-row">
    <div class="image-block">
      <img src="media/me_close" alt="Anette close up (1x zoom)">
      <p class="image-blurb">Anette close up (1x zoom)</p>
    </div>
    <div class="image-block">
      <img src="media/me_far" alt="Anette farther away and zoomed in (3x zoom)">
      <p class="image-blurb">Anette farther away and zoomed in (3x zoom)</p>
    </div>
  </div>

</body>
</html>
